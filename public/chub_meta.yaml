project_name: "Dungeon Master Engine"

tagline: "Persistent seeded dungeon engine for Chub roleplay."

visibility: "PRIVATE"

position: "ADJACENT"

tags:
  - "Stage"
  - "RPG"
  - "Dungeon"
  - "Game Engine"

state_schema:

  init:
    type: object
    properties:
      seed:
        type: integer

  message:
    type: object
    properties:

      floor:
        type: integer

      playerX:
        type: integer

      playerY:
        type: integer

      turn:
        type: integer

      map:
        type: array
        items:
          type: string

      currentRoom:
        type: string

      activeCreatureId:
        type: string

      activeTrapId:
        type: string

  chat:
    type: object
    properties:
      visited:
        type: array
        items:
          type: string

is_anonymous: false

ratings_disabled: true

github_path: 'https://github.com/PRDWN1/dungeon-master-stage'