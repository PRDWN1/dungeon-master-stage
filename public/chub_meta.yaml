project_name: "Dungeon Master Engine"

tagline: "Persistent seeded dungeon engine for Chub roleplay."

visibility: "PRIVATE"

position: "ADJACENT"

tags:
  - "Stage"
  - "RPG"
  - "Dungeon"
  - "Game Engine"

config_schema:
  type: object
  properties: {}

state_schema:
  init:
    type: object
    properties:
      seed:
        type: integer
      floor:
        type: integer
      map:
        type: array
        items:
          type: string

  message:
    type: object
    properties:
      playerX:
        type: integer
      playerY:
        type: integer
      turn:
        type: integer

  chat:
    type: object
    properties: {}

is_anonymous: false

ratings_disabled: true

