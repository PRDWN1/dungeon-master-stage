project_name: "Dungeon Master Engine"

tagline: "Persistent seeded dungeon state engine for Chub roleplay."

visibility: "PRIVATE"

position: "ADJACENT"

tags:
  - "Stage"
  - "RPG"
  - "Dungeon"
  - "Game Engine"

config_schema:
  type: object
  properties:
    debug:
      title: "Debug mode"
      description: "Reserved for development diagnostics."
      type: boolean
      default: false

state_schema:
  init:
    type: object
    properties:
      seed:
        type: integer

  message:
    type: object
    properties:
      version:
        type: integer
      seed:
        type: integer
      floor:
        type: integer
      turn:
        type: integer
      playerX:
        type: integer
      playerY:
        type: integer
      map:
        type: array
        items:
          type: string
      lastUserMessage:
        type:
          - string
          - "null"
      lastMapAccepted:
        type: boolean

  chat:
    type: object
    properties: {}

is_anonymous: false
ratings_disabled: true

github_path: 'https://github.com/PRDWN1/dungeon-master-stage'
