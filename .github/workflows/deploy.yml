# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy Dungeon Master Stage

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
      STAGE_ID_SECRET: ${{ secrets.STAGE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "21.7.1"

      - name: Enable Yarn
        shell: bash
        run: |
          set -e
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Check CHUB_AUTH_TOKEN
        shell: bash
        run: |
          set -e
          test -n "$CHUB_AUTH_TOKEN"
          echo "CHUB_AUTH_TOKEN is configured."

      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile

      - name: Build Stage
        shell: bash
        run: yarn build

      - name: Create build archive
        shell: bash
        run: |
          set -e
          rm -f build.zip
          cd dist
          zip -r ../build.zip .
          cd ..
          test -s build.zip
          echo "build.zip created."

      - name: Use existing Stage ID
        if: ${{ env.STAGE_ID_SECRET != '' }}
        shell: bash
        run: |
          set -e
          echo "Using STAGE_ID from GitHub Secrets."
          echo "STAGE_ID=$STAGE_ID_SECRET" >> "$GITHUB_ENV"

      - name: Create new Stage
        if: ${{ env.STAGE_ID_SECRET == '' }}
        shell: bash
        run: |
          set -e
          echo "No STAGE_ID secret found."
          echo "Creating a new Stage in Chub..."

          rm -f creation.json

          curl --fail-with-body -sS             -H "CH-API-KEY: $CHUB_AUTH_TOKEN"             -H "Content-Type: application/json"             -X POST             --data '{"name":"Dungeon Master Engine"}'             "https://api.chub.ai/extensions"             -o creation.json || { echo "CHUB API RESPONSE:"; cat creation.json 2>/dev/null || true; exit 5; }

          echo "CHUB API RESPONSE:"
          cat creation.json
          echo

          STAGE_ID="$(python3 -c 'import json; d=json.load(open("creation.json", encoding="utf-8")); print(d.get("id_v2") or d.get("id") or "")')"
          test -n "$STAGE_ID"
          echo "STAGE_ID=$STAGE_ID" >> "$GITHUB_ENV"
          echo "Stage ID created."

      - name: Upload Stage to Chub
        shell: bash
        run: |
          set -e
          test -n "$STAGE_ID"
          rm -f upload_response.txt

          curl --fail-with-body -sS             -H "CH-API-KEY: $CHUB_AUTH_TOKEN"             -F "file=@build.zip"             "https://api.chub.ai/extension/$STAGE_ID/upload"             -o upload_response.txt || { echo "CHUB UPLOAD RESPONSE:"; cat upload_response.txt 2>/dev/null || true; exit 8; }

          echo "CHUB UPLOAD RESPONSE:"
          cat upload_response.txt
          echo
          echo "Stage uploaded successfully."
