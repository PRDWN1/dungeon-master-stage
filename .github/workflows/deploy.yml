# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy Dungeon Master Stage

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "21.7.1"

      - name: Enable Yarn
        shell: bash
        run: |
          set -e
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Check CHUB_AUTH_TOKEN
        shell: bash
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          set -e
          if [ -z "$CHUB_AUTH_TOKEN" ]; then
            echo "ERROR: CHUB_AUTH_TOKEN is missing."
            exit 1
          fi
          echo "CHUB_AUTH_TOKEN is configured."

      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile

      - name: Build Stage
        shell: bash
        run: yarn build

      - name: Create build archive
        shell: bash
        run: |
          set -e
          rm -f build.zip
          cd dist
          zip -r ../build.zip .
          cd ..
          test -s build.zip
          echo "build.zip created."

      - name: Resolve or create Stage ID
        shell: bash
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
          STAGE_ID_SECRET: ${{ secrets.STAGE_ID }}
        run: |
          set -e

          STAGE_ID="$STAGE_ID_SECRET"

          if [ -n "$STAGE_ID" ]; then
            echo "Using STAGE_ID from GitHub Secrets."
          else
            echo "No STAGE_ID secret found."
            echo "Creating a new Stage in Chub..."

            rm -f creation.json

            HTTP_STATUS=$(curl -sS               -o creation.json               -w "%{http_code}"               -H "CH-API-KEY: $CHUB_AUTH_TOKEN"               -H "Content-Type: application/json"               -X POST               --data "{\"name\":\"Dungeon Master Engine\"}"               "https://api.chub.ai/extensions")

            echo "HTTP_STATUS:$HTTP_STATUS"
            echo "CHUB API RESPONSE:"
            cat creation.json
            echo

            if [[ "$HTTP_STATUS" != 2* ]]; then
              echo "ERROR: Chub Stage creation request failed."
              exit 5
            fi