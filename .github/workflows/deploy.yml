# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy Dungeon Master Stage

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "21.7.1"

      - name: Enable Yarn
        shell: bash
        run: |
          set -e
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Check required secret
        shell: bash
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          set -e
          if [ -z "$CHUB_AUTH_TOKEN" ]; then
            echo "ERROR: CHUB_AUTH_TOKEN is missing."
            exit 1
          fi
          echo "CHUB_AUTH_TOKEN is configured."

      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile

      - name: Build Stage
        shell: bash
        run: yarn build

      - name: Create build archive
        shell: bash
        run: |
          set -e
          rm -f build.zip
          cd dist
          zip -r ../build.zip .
          cd ..
          test -s build.zip
          echo "build.zip created."

      - name: Resolve Stage ID
        shell: bash
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
          SECRET_STAGE_ID: ${{ secrets.STAGE_ID }}
        run: |
          set -e

          STAGE_ID=""

          if [ -n "$SECRET_STAGE_ID" ]; then
            STAGE_ID="$SECRET_STAGE_ID"
            echo "Using STAGE_ID from GitHub Secrets."
          elif [ -f public/chub_meta.yaml ]; then
            STAGE_ID="$(sed -n "s/^extension_id:[[:space:]]*['\"]\{0,1\}\([^'\"]*\)['\"]\{0,1\}[[:space:]]*$/\1/p" public/chub_meta.yaml | head -n 1)"
            if [ -n "$STAGE_ID" ]; then
              echo "Using extension_id from public/chub_meta.yaml."
            fi
          fi

          if [ -z "$STAGE_ID" ]; then
            echo "No existing Stage ID found."
            echo "Creating a new Stage in Chub..."

            RESPONSE_FILE="$(mktemp)"

            HTTP_STATUS="$(curl -sS               -o "$RESPONSE_FILE"               -w "%{http_code}"               -H "CH-API-KEY: $CHUB_AUTH_TOKEN"               -H "Content-Type: application/json"               -X POST               --data '{"name":"Dungeon Master Engine"}'               "https://api.chub.ai/extensions")"

            echo "HTTP_STATUS:$HTTP_STATUS"